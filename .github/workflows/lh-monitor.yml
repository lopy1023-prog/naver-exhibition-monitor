name: LH Suwon notice monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: lh-suwon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LH dependencies
        run: python -m pip install -r lh-monitor/requirements.txt
      - name: Collect LH notices
        run: python lh-monitor/monitor.py
      - name: Validate LH data
        run: python lh-monitor/monitor.py --validate
      - name: Run LH tests
        run: python -m unittest discover -s lh-monitor/tests -v
      - name: Store failure report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lh-monitor-failure
          path: |
            data/lh/lh-feed.json
            data/lh/lh-report.json
      - name: Commit LH JSON only
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/lh)" ]; then
            echo "No LH data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lh/lh-feed.json data/lh/lh-report.json data/lh/lh-state.json data/lh/lh-tracked-state.json
          git commit -m "chore: update LH monitoring data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
