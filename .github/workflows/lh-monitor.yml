name: LH Suwon notice monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: lh-suwon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check LH refresh age
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          due = True
          if os.environ["EVENT_NAME"] == "schedule":
              try:
                  report = json.loads(Path("data/lh/lh-report.json").read_text(encoding="utf-8"))
                  synced = datetime.fromisoformat(report["syncedAt"]).astimezone(timezone.utc)
                  age_minutes = (datetime.now(timezone.utc) - synced).total_seconds() / 60
                  due = report.get("sourceStatus") != "ok" or age_minutes >= 55
              except (OSError, ValueError, KeyError, TypeError):
                  due = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"due={str(due).lower()}\n")
          print(f"LH refresh due: {due}")
          PY
      - name: Install LH dependencies
        if: steps.freshness.outputs.due == 'true'
        run: python -m pip install -r lh-monitor/requirements.txt
      - name: Collect LH notices
        if: steps.freshness.outputs.due == 'true'
        id: collect
        shell: bash
        run: |
          set +e
          timeout --signal=INT 48m python lh-monitor/monitor.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Validate LH data
        if: steps.freshness.outputs.due == 'true'
        run: python lh-monitor/monitor.py --validate
      - name: Run LH tests
        if: steps.freshness.outputs.due == 'true'
        run: python -m unittest discover -s lh-monitor/tests -v
      - name: Publish LH failure status
        if: failure()
        shell: bash
        run: |
          if [ "${{ steps.collect.outputs.exit_code }}" = "124" ]; then
            reason="LH 수집 48분 제한 초과; Actions 로그 확인 필요"
          else
            reason="LH 수집 또는 검증 실패; Actions 로그 확인 필요"
          fi
          python lh-monitor/monitor.py --mark-failure "$reason"
      - name: Store failure report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lh-monitor-failure
          path: |
            data/lh/lh-feed.json
            data/lh/lh-report.json
      - name: Commit LH JSON only
        if: success() || failure()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/lh)" ]; then
            echo "No LH data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lh/lh-feed.json data/lh/lh-report.json
          if [ "${{ job.status }}" = "success" ]; then
            git add data/lh/lh-state.json data/lh/lh-tracked-state.json
          else
            git restore -- data/lh/lh-state.json data/lh/lh-tracked-state.json
          fi
          git commit -m "chore: update LH monitoring data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
