[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200
  force = true

[[redirects]]
  from = "/api/collect"
  to = "/.netlify/functions/collect-now"
  status = 200
  force = true

[[redirects]]
  from = "/status"
  to = "/.netlify/functions/status-page"
  status = 200
  force = true
